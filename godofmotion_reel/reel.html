/* ---------------- SCENE B: 2-4s kinetic type ---------------- */

/* ---------------- SCENE C: 4-6s shape morphing ---------------- */
function letterPolys(i){ // B E A T at SMALL layout -> screen
  const S=SMALL(i),g=G.black.g[S.ch],gcx=(g.bb[0]+g.bb[2])/2;
  const tf=p=>[S.cx+(p[0]-gcx)*S.ex,S.base+p[1]*S.ey];

}
const LP=[0,1,2,3].map(letterPolys);
function ringCurl(t){ // line (beat 9) curls into ring (beat 10)
  const cu=sp(t,4.5,4.95,8);const Th=TAU*cu,L=lerp(1200,TAU*RR,cu),M=[CX,lerp(CY,CY+RR,cu)];
  const k=Th/L,pts=[];const N=180;

}
function strokePts(ctx,pts,col,lw,closed=false){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(closed)ctx.closePath();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='butt';ctx.lineJoin='round';ctx.stroke();}
function orbitAlpha(t){return 45*D2R*sp(t,4.5,4.95,8)+90*D2R*sp(t,5.0,5.45,8)+50*D2R*eIO(seg(t,5.5,5.95));}
function slabRect(i){const s=SLAB[i];return prep([[-s.r,-STH/2],[s.r,-STH/2],[s.r,STH/2],[-s.r,STH/2]].flatMap((p,k,a)=>{const q=a[(k+1)%4];return Array.from({length:10},(_,m)=>lerp2(p,q,m/10));}));}
const SLABPOLY=SLAB.map((_,i)=>slabRect(i));
function drawRing(ctx,e,psi,half,col,lw,ticks){ // half: 0 all, -1 back, +1 front
  ctx.save();ctx.translate(CX,CY);ctx.rotate(psi);
  const N=200,pts=[];
  const inHalf=a=>half===0||(half<0?Math.sin(a)<=0:Math.sin(a)>=0);
  ctx.beginPath();let pen=false;
  for(let n=0;n<=N;n++){const a=n/N*TAU;if(!inHalf(a)&&!(half!==0&&Math.abs(Math.sin(a))<1e-9)){pen=false;continue;}
    const x=RR*Math.cos(a),y=RR*Math.sin(a)*e;if(!pen){ctx.moveTo(x,y);pen=true;}else ctx.lineTo(x,y);}
  ctx.strokeStyle=HEX[col];ctx.lineWidth=lw;ctx.lineCap='butt';ctx.stroke();
  if(ticks&&ticks.len>0.5){ctx.beginPath();
    for(let k=0;k<48;k++){const a=k*TAU/48+ticks.yaw;const aa=((a%TAU)+TAU)%TAU;if(!inHalf(aa))continue;
      const L=ticks.len*(k%4===0?1.8:1),r0=RR+6,r1=r0+L;
      ctx.moveTo(r0*Math.cos(a),r0*Math.sin(a)*e);ctx.lineTo(r1*Math.cos(a),r1*Math.sin(a)*e);}

function sceneC(ctx,t){

    ctx.fillStyle=HEX.red;ctx.fillRect(RECT.x0,y0,RECT.x1-RECT.x0,y1-y0);}
  const q12=eIO(seg(t,5.5,5.95));

      const pts=src.outer.map((p,k)=>[lerp(p[0],c[0]+Sh.pts[k][0],m),lerp(p[1],c[1]+Sh.pts[k][1],m)]);
      poly(ctx,pts);const hp=clamp(m*1.7);

      const tgt=[CX,CY+SLAB[si].yc];const P=lerp2(pos,tgt,q12);const rot=th*(1-q12);const s=lerp(sc,1,q12);
      const cr=Math.cos(rot),sr=Math.sin(rot);
      const pts=Sh.pts.map((p,k)=>{const lx=lerp(p[0]*s,SLABPOLY[si][k][0],q12),ly=lerp(p[1]*s,SLABPOLY[si][k][1],q12);return [P[0]+lx*cr-ly*sr,P[1]+lx*sr+ly*cr];});

/* ---------------- SCENE D: 6-8s 2D -> 3D sliced sphere ---------------- */
function sphereParams(t){

}
function drawSlabs(ctx,P){

/* ---------------- SCENE E: 8-10s telemetry gauge -> mixer ---------------- */
function counter(ctx,cx,cy,r,t,seq,size,shape){

  const nw=seq[i][0],od=i>0?seq[i-1][0]:'';const e=eOut(seg(t,seq[i][1],seq[i][1]+0.2));
  ctx.save();if(shape){shape();ctx.clip();}ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.clip();
  const base=cy+CAP*size/2-size*0.08,D=size*2;
  if(od)text(ctx,'black',od,cx,base-D*e,size,'#FFFFFF',{align:.5,track:-0.04});
  if(nw)text(ctx,'black',nw,cx,base+D*(1-e),size,'#FFFFFF',{align:.5,track:-0.04});
  const lb=eOut(seg(t,seq[0][1]+0.05,seq[0][1]+0.3))*(seq[seq.length-1][0]===''?1-eIn(seg(t,seq[seq.length-1][1],seq[seq.length-1][1]+0.15)):1);
  if(lb>0)text(ctx,'bold','BEAT',cx,base+size*0.36+(1-lb)*40,size*0.12,'#FFFFFF',{align:.5,track:0.3});

}
const COUNT_SEQ=[['17',8.0],['18',8.5],['19',9.0],['20',9.5],['21',10.0],['',10.5]];
function uncurl(start,len,turn,N){ // clockwise curve starting heading right

}

function sceneE(ctx,t){
  const g=sp(t,8.0,8.4,8),u=t>=9.5?1:0;

  // ring -> ruler
  const ur=sp(t,9.5,9.95,8);
  {const L=lerp(TAU*RR,RULER.len,ur),start=lerp2([CX,CY-RR],[RULER.x,RULER.y],ur),turn=TAU*(1-ur);
   const pts=uncurl(start,L,turn,220);strokePts(ctx,pts,HEX.red,5);
   ctx.beginPath();for(let k=0;k<48;k++){const s=k/48;const p=uncurl(start,L*s,turn*s,1)[1];const h=p[2];const nx=Math.sin(h),ny=-Math.cos(h);
     const len=22*(k%4===0?1.8:1),r0=6;ctx.moveTo(p[0]+nx*r0,p[1]+ny*r0);ctx.lineTo(p[0]+nx*(r0+len),p[1]+ny*(r0+len));}
   ctx.strokeStyle=HEX.ink;ctx.lineWidth=3;ctx.stroke();}
  // rails (draw-on)

  if(rail>0.001){ctx.strokeStyle=HEX.ink;ctx.lineWidth=1.5;for(let j=0;j<7;j++){ctx.beginPath();ctx.arc(CX,CY,TR_R(j),-Math.PI/2,-Math.PI/2+TAU*rail);ctx.stroke();}}
  // tracks

    const [ri,ro,col]=TR_SRC[j];const rIn=lerp(ri,TR_R(j)-9,g),rOut=lerp(ro,TR_R(j)+9,g);const r=(rIn+rOut)/2,wd=rOut-rIn;
    const span=trackSpan(t,j);

    const L=lerp(r*span,BARV[j]*BMAX,uj),start=lerp2([CX,CY-r],[BX0,ROWY(j)],uj),turn=span*(1-uj);

    ctx.save();ctx.beginPath();ctx.rect(460,ROWY(j)-30,170*lb,60);ctx.clip();

  ctx.beginPath();ctx.arc(disc.x,disc.y,disc.r,0,TAU);ctx.fillStyle=HEX.red;ctx.fill();

/* ---------------- SCENE F: 10-12s bars -> 3D risers -> barcode ---------------- */
function barState(t,j){

function childRects(t){ // after 11.0
  const b23=sp(t,11.0,11.45,8),b24=0.6*sp(t,11.5,11.85,8)+0.4*eIn(seg(t,11.5,12.0));

    let a=lerp(x0,L2[n][0],b23),b=lerp(x0+56/6,L2[n][1],b23);a=lerp(a,L3[n][0],b24);b=lerp(b,L3[n][1],b24);

function sceneF(ctx,t){

      for(let k=0;k<48;k++){const x=RULER.x+k/48*RULER.len;if(x>RULER.x+RULER.len*rr)break;const len=22*(k%4===0?1.8:1);ctx.moveTo(x,RULER.y-6);ctx.lineTo(x,RULER.y-6-len);}

function layG(word,t,tw){const L=bigLayout(word,900,990,1800);const s=1+0.035*seg(t,tw+0.2,tw+0.5);return L.map(l=>({...l,cx:CX+(l.cx-CX)*s,base:CY+(l.base-CY)*s,ex:l.ex*s,ey:l.ey*s}));}

/* ---------------- SCENE H: 14-15s collapse -> lockup ---------------- */
function sceneH(ctx,t){
  const c=eIO(seg(t,14.0,14.42));

/* ---------------- HUD ---------------- */
function hud(ctx,t){
  const beat=Math.floor(t/0.5)+1;const f=n=>String(n).padStart(2,'0');
  const cs=Math.floor((t%1)*100);

  text(ctx,'bold','GODOFMOTION',48,62,15,HEX.ink,o);
  text(ctx,'bold',`BEAT ${f(beat)} / 30`,W-48,62,15,HEX.ink,{...o,align:1});
  text(ctx,'bold','120 BPM · 4/4',48,H-46,15,HEX.ink,o);
  text(ctx,'bold',`00:${f(Math.floor(t))}.${f(cs)}`,W-48,H-46,15,HEX.ink,{...o,align:1});
}

/* ---------------- frame ---------------- */
function render(ctx,t){
  t=((t%LOOP)+LOOP)%LOOP;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.fillStyle=HEX.bg;ctx.fillRect(0,0,W,H);

}
const cv=document.getElementById('c'),main=cv.getContext('2d');
const work=document.createElement('canvas');work.width=W;work.height=H;const wctx=work.getContext('2d');
// temporal super-sampling inside the shutter: blur follows real speed + direction
window.seek=function(t,K=4,span=1/360){

  for(let k=0;k<K;k++){const tk=t+((k+0.5)/K-0.5)*span;render(wctx,tk);main.globalAlpha=1/(k+1);main.drawImage(work,0,0);}
  main.globalAlpha=1;
};
window.seek(0,1);

<script>
